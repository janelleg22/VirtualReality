<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box wireframe=true position="0 0 0" width="1.5" height="2" depth="3"> </a-box>
      <a-box position="0 0 0" rotation="0 0 0" width="3" height="1" depth="2" color="#4CC3D9"></a-box>
      <a-box position="0 1 -.1" rotation="0 0 0" width="2" height="1" depth="2" color="#4CC3D9"></a-box>

      <a-sphere position="-1.5 -.5 -1" radius= .5" color="BLACK"></a-sphere>
      <a-sphere position="-1.5 -.5 1" radius= .5" color="BLACK"></a-sphere>
      <a-sphere position="1.5 -.5 -1" radius= .5" color="BLACK"></a-sphere>
      <a-sphere position="1.5 -.5 1" radius= .5" color="BLACK"></a-sphere>

      <a-plane position="-1.5 1 1" rotation="0 0 0" width=".7" height=".5" color="yellow"></a-plane>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
