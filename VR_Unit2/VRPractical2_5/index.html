<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="wall.js"></script>
    <script src="coin.js"></script>
    <script src="key.js"></script>
    <script src="script.js"></script>



  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Challenge
             Upload a picture to use as the texture for the walls of your maze if you want
        -->
        <img id="stone" src="stone.jpg" />
        <img id="gold" src="gold.jpg" />
        <img id="ground" src="ground.jpg" />
        <img id="stars" src="stars.jpg" />



      </a-assets>
      <a-plane position="0 0 0" rotation="-90 0 0" width="150" height="150" color="grey" src="#ground" repeat="30 30"></a-plane>
      
      
      <a-sky src="#stars" ></a-sky>
      <a-camera position="-2 10 -5" rotation="0 0 0"></a-camera>
    </a-scene>
  </body>   
</html>
